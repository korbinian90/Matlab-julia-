name: Test MJSE

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up MATLAB
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2024b
    
    - name: Set up Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: '1.12'
    
    - name: Install patchelf (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y patchelf
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Build Java bridge
      shell: bash
      run: |
        cd m_src/mjse
        javac Bridge.java
        jar cf ../MJSEBridge.jar -C . .
        cd ../..
    
    - name: Verify Java bridge
      shell: bash
      run: |
        ls -lh m_src/MJSEBridge.jar
    
    - name: Set up Julia environment
      shell: bash
      run: |
        julia --project=jl_src -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
    
    - name: Run MATLAB tests (with MJSE_SHADOW_LIBS on Linux)
      if: runner.os == 'Linux'
      uses: matlab-actions/run-command@v2
      env:
        MJSE_SHADOW_LIBS: '1'
      with:
        command: |
          addpath('m_src');
          addpath('tests');
          test_roundtrip();
    
    - name: Run MATLAB tests (macOS/Windows)
      if: runner.os != 'Linux'
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath('m_src');
          addpath('tests');
          test_roundtrip();
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: mjse-logs-${{ matrix.os }}
        path: |
          /tmp/mjse_worker.log
          ${{ runner.temp }}/mjse_worker.log
        if-no-files-found: ignore
