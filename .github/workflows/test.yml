name: Test MJSE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up MATLAB
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2024b
    
    - name: Set up Java (for Java bridge compilation)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Run MATLAB tests (auto-setup handles Julia download and bridge build)
      if: runner.os == 'Linux'
      uses: matlab-actions/run-command@v2
      env:
        MJSE_SHADOW_LIBS: '1'
      with:
        command: |
          addpath('m_src');
          addpath('tests');
          test_roundtrip();
    
    - name: Run MATLAB tests (auto-setup handles Julia download and bridge build)
      if: runner.os != 'Linux'
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath('m_src');
          addpath('tests');
          test_roundtrip();
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: mjse-logs-${{ matrix.os }}
        path: |
          /tmp/mjse_worker.log
          ${{ runner.temp }}/mjse_worker.log
        if-no-files-found: ignore
